[project]
name = "relayops"
version = "0.1.0"
description = "RelayOps support-to-engineering operations backend"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Rithika Sankar Rajeswari" }]
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "sqlalchemy==2.1.8",
  "alembic==1.20.1",
  "psycopg[binary,pool]==3.3.8",
  "pgvector==0.5.1",
  "argon2-cffi==25.1.0",
  "httpx==0.28.1",
  "langgraph==1.2.20",
  "langgraph-checkpoint-postgres==3.2.0",
  "python-multipart==0.0.33",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4", "mypy==2.4.1", "pytest-timeout==2.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relayops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
timeout = 120
markers = ["live: requires a running Ollama with the configured models (opt-in, never faked)"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "W"]
ignore = ["S101", "S311", "B008", "S608", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"alembic/**" = ["E501", "W291"]

[tool.mypy]
python_version = "3.12"
packages = ["relayops"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
